<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGC Image Classifier</title>
    <style>
        :root {
            --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
            --accent: #6c63ff; --accent-hover: #5a52e0;
            --text: #e4e4e7; --muted: #9ca3af;
            --green: #22c55e; --yellow: #eab308; --red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── Top bar ── */
        .topbar { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .topbar h1 { font-size: 1rem; font-weight: 700; white-space: nowrap; }
        .topbar h1 span { color: var(--accent); }
        .topbar-field { display: flex; align-items: center; gap: 0.4rem; }
        .topbar-field label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
        .topbar input, .topbar select {
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
            color: var(--text); padding: 0.35rem 0.6rem; font-size: 0.82rem;
        }
        .topbar input:focus, .topbar select:focus { outline: none; border-color: var(--accent); }
        #apiKey { width: 260px; }

        /* ── Container ── */
        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

        /* ── Drop zone ── */
        .drop-zone {
            border: 2px dashed var(--border); border-radius: 12px;
            padding: 2rem; text-align: center; cursor: pointer;
            transition: border-color 0.2s, background 0.2s; margin-bottom: 1rem;
        }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(108,99,255,0.05); }
        .drop-zone p { color: var(--muted); font-size: 0.85rem; margin-top: 0.35rem; }
        .drop-zone .link { color: var(--accent); text-decoration: underline; cursor: pointer; }
        .drop-zone svg { width: 36px; height: 36px; color: var(--muted); }

        /* ── URL input ── */
        .url-section { margin-bottom: 1.5rem; }
        .url-section textarea {
            width: 100%; min-height: 72px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); padding: 0.6rem 0.75rem; font-size: 0.82rem;
            font-family: monospace; resize: vertical;
        }
        .url-section textarea:focus { outline: none; border-color: var(--accent); }
        .url-section textarea::placeholder { color: var(--muted); }
        .url-row { display: flex; align-items: flex-start; gap: 0.75rem; }
        .url-row textarea { flex: 1; }
        .url-btn {
            background: var(--accent); color: #fff; border: none; border-radius: 8px;
            padding: 0.6rem 1.2rem; font-size: 0.82rem; font-weight: 600; cursor: pointer;
            white-space: nowrap; margin-top: 1px;
        }
        .url-btn:hover { background: var(--accent-hover); }
        .url-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .or-divider { text-align: center; color: var(--muted); font-size: 0.78rem; margin-bottom: 1rem; }

        /* ── Progress ── */
        .progress { margin-bottom: 1.25rem; display: none; }
        .progress.visible { display: block; }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
        .progress-track { height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; width: 0%; }

        /* ── Toolbar ── */
        .toolbar { justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem; display: none; }
        .toolbar.visible { display: flex; }
        .btn {
            padding: 0.38rem 0.85rem; border-radius: 6px; font-size: 0.8rem; font-weight: 500;
            cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted);
        }
        .btn:hover { background: var(--surface); color: var(--text); }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .summary-pills { display: flex; gap: 0.75rem; font-size: 0.8rem; }
        .pill { display: flex; align-items: center; gap: 0.3rem; }
        .pill-dot { width: 8px; height: 8px; border-radius: 50%; }
        .pill-dot.g { background: var(--green); } .pill-dot.y { background: var(--yellow); } .pill-dot.r { background: var(--red); }

        /* ── Table ── */
        .results-table { width: 100%; border-collapse: collapse; display: none; }
        .results-table.visible { display: table; }
        .results-table th {
            text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--muted); padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--border);
            background: var(--bg); position: sticky; top: 0;
        }
        .results-table td { padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--border); font-size: 0.82rem; vertical-align: middle; }
        .results-table tr:hover td { background: var(--surface); }

        .thumb-cell { display: flex; align-items: center; gap: 0.7rem; min-width: 200px; }
        .thumb {
            width: 48px; height: 48px; border-radius: 6px; object-fit: cover;
            background: var(--surface); flex-shrink: 0; cursor: pointer;
        }
        .fname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

        .badge {
            display: inline-block; padding: 0.14rem 0.5rem; border-radius: 999px;
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .badge-yes { background: rgba(34,197,94,0.13); color: var(--green); }
        .badge-no { background: rgba(239,68,68,0.13); color: var(--red); }
        .badge-maybe { background: rgba(234,179,8,0.13); color: var(--yellow); }
        .badge-approve { background: rgba(34,197,94,0.13); color: var(--green); }
        .badge-review { background: rgba(234,179,8,0.13); color: var(--yellow); }
        .badge-reject { background: rgba(239,68,68,0.13); color: var(--red); }

        .stars { letter-spacing: 1px; white-space: nowrap; }
        .star-on { color: var(--yellow); }
        .star-off { color: var(--border); }

        .error-cell { color: var(--red); font-size: 0.78rem; }

        /* ── Modal ── */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; }
        .modal.visible { display: flex; }
        .modal img { max-width: 90vw; max-height: 88vh; border-radius: 8px; }
        .modal-x { position: fixed; top: 1rem; right: 1.5rem; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; z-index: 101; }

        .empty { text-align: center; color: var(--muted); padding: 2rem; font-size: 0.88rem; }

        @media (max-width: 700px) {
            .container { padding: 1rem; }
            .thumb-cell { min-width: auto; }
            .fname { max-width: 90px; }
            #apiKey { width: 160px; }
        }
    </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
    <h1><span>UGC</span> Image Classifier</h1>
    <div class="topbar-field">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
    </div>
</div>

<div class="container">

    <!-- File upload -->
    <div class="drop-zone" id="dropZone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>Drag &amp; drop images here, or <span class="link" id="browseLink">browse files</span></p>
        <p style="font-size:0.72rem">JPG, PNG, WebP, GIF &middot; multiple files supported</p>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>

    <div class="or-divider">&mdash; or paste image URLs &mdash;</div>

    <!-- URL input -->
    <div class="url-section">
        <div class="url-row">
            <textarea id="urlInput" placeholder="Paste image URLs, one per line&#10;https://example.com/photo1.jpg&#10;https://example.com/photo2.jpg"></textarea>
            <button class="url-btn" id="urlBtn">Classify URLs</button>
        </div>
    </div>

    <!-- Progress -->
    <div class="progress" id="progress">
        <div class="progress-header">
            <span id="progressLabel">Classifying...</span>
            <span id="progressCount">0 / 0</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
        <div class="summary-pills">
            <div class="pill"><div class="pill-dot g"></div> Approve: <strong id="cApprove">0</strong></div>
            <div class="pill"><div class="pill-dot y"></div> Review: <strong id="cReview">0</strong></div>
            <div class="pill"><div class="pill-dot r"></div> Reject: <strong id="cReject">0</strong></div>
        </div>
        <div style="display:flex;gap:0.5rem;">
            <button class="btn" id="clearBtn">Clear</button>
            <button class="btn btn-primary" id="exportBtn">Export CSV</button>
        </div>
    </div>

    <!-- Results table -->
    <table class="results-table" id="table">
        <thead>
            <tr>
                <th>Image</th>
                <th>Furniture?</th>
                <th>Quality (1-5)</th>
                <th>Spam?</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <div class="empty" id="empty">Upload images or paste URLs above to get started.</div>
</div>

<!-- Preview modal -->
<div class="modal" id="modal">
    <button class="modal-x" id="modalX">&times;</button>
    <img id="modalImg" src="" alt="preview">
</div>

<script>
// ─── State ───
const rows = []; // { name, thumbSrc, furniture, quality, spam, action, error }
let batchRunning = false;

// ─── DOM ───
const $ = id => document.getElementById(id);
const dropZone = $('dropZone'), fileInput = $('fileInput');
const urlInput = $('urlInput'), urlBtn = $('urlBtn');
const progress = $('progress'), progressLabel = $('progressLabel'), progressCount = $('progressCount'), progressFill = $('progressFill');
const toolbar = $('toolbar'), table = $('table'), tbody = $('tbody'), empty = $('empty');
const modal = $('modal'), modalImg = $('modalImg');
const apiKeyEl = $('apiKey');

// Persist key in sessionStorage
apiKeyEl.value = sessionStorage.getItem('_ak') || '';
apiKeyEl.addEventListener('input', () => sessionStorage.setItem('_ak', apiKeyEl.value));

// ─── Prompt ───
const PROMPT = `You are an image classifier for a furniture ecommerce website. Analyze this image and respond with ONLY a JSON object — no markdown fences, no explanation.

{
  "furniture": "Yes" | "No" | "Maybe",
  "quality": 1-5,
  "spam": "Yes" | "No"
}

Rules:
- "furniture": Does this image contain furniture — specifically sofas, tables, chairs, beds, shelving, lighting, rugs, or home accessories? "Yes" if clearly present, "No" if none visible, "Maybe" if partially visible or uncertain.
- "quality": Rate suitability for an ecommerce product page from 1 (unusable) to 5 (excellent). Consider: Is the product clearly visible and in focus? Is the lighting good? Is the composition clean? Is the resolution adequate?
  - 5 = sharp, well-lit, product is hero, clean background
  - 4 = good quality, minor issues
  - 3 = acceptable, some problems (dim, cluttered, slightly off-center)
  - 2 = poor (blurry, dark, product hard to see)
  - 1 = unusable (extremely blurry, wrong content, unrecognizable)
- "spam": Is this image a mood board, collage, screenshot, meme, text graphic, stock watermark overlay, or otherwise NOT a real customer photo? "Yes" if so, "No" if it appears to be a genuine photograph.

Return ONLY the JSON.`;

// ─── Normalize + Bucket ───
function normalizeResult(raw) {
    // Normalize casing and types from model response
    const furniture = capitalize(String(raw.furniture || 'Maybe'));
    const spam = capitalize(String(raw.spam || 'No'));
    const quality = Math.max(1, Math.min(5, Math.round(Number(raw.quality) || 1)));
    return { furniture, quality, spam };
}

function capitalize(s) {
    const lower = s.toLowerCase().trim();
    if (lower === 'yes') return 'Yes';
    if (lower === 'no') return 'No';
    if (lower === 'maybe') return 'Maybe';
    return s.trim();
}

function getAction(furniture, quality, spam) {
    if (furniture === 'No' || spam === 'Yes') return 'Reject';
    if (furniture === 'Yes' && quality >= 3 && spam === 'No') return 'Approve';
    return 'Review';
}

// ─── API call ───
async function classifyBase64(base64, mediaType, apiKey) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 256,
            messages: [{
                role: 'user',
                content: [
                    { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
                    { type: 'text', text: PROMPT }
                ]
            }]
        })
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API ${res.status}`);
    }
    const data = await res.json();
    const raw = (data.content?.[0]?.text || '').replace(/```json\s*/g, '').replace(/```/g, '').trim();
    return JSON.parse(raw);
}

async function classifyUrl(url, apiKey) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 256,
            messages: [{
                role: 'user',
                content: [
                    { type: 'image', source: { type: 'url', url } },
                    { type: 'text', text: PROMPT }
                ]
            }]
        })
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API ${res.status}`);
    }
    const data = await res.json();
    const raw = (data.content?.[0]?.text || '').replace(/```json\s*/g, '').replace(/```/g, '').trim();
    return JSON.parse(raw);
}

// ─── File to base64 ───
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(file);
    });
}

// ─── Batch processor ───
let batchAborted = false;

async function processBatch(items) {
    // items: [{ name, thumbSrc, isBlobUrl, getClassification: async fn => {furniture,quality,spam} }]
    const apiKey = apiKeyEl.value.trim();
    if (!apiKey) { alert('Please enter your Anthropic API key.'); apiKeyEl.focus(); return; }
    if (!items.length) return;
    if (batchRunning) { alert('A batch is already processing. Wait for it to finish or clear results first.'); return; }
    batchRunning = true;
    batchAborted = false;
    urlBtn.disabled = true;

    progress.classList.add('visible');
    toolbar.classList.add('visible');
    table.classList.add('visible');
    empty.style.display = 'none';

    let done = 0;
    const total = items.length;
    progressLabel.textContent = 'Classifying...';
    progressCount.textContent = `0 / ${total}`;
    progressFill.style.width = '0%';

    // Process 3 at a time
    const queue = [...items];
    async function next() {
        if (!queue.length || batchAborted) return;
        const item = queue.shift();
        try {
            const raw = await item.getClassification(apiKey);
            if (batchAborted) return;
            const result = normalizeResult(raw);
            const action = getAction(result.furniture, result.quality, result.spam);
            rows.push({ name: item.name, thumbSrc: item.thumbSrc, isBlobUrl: !!item.isBlobUrl, furniture: result.furniture, quality: result.quality, spam: result.spam, action });
        } catch (err) {
            if (batchAborted) return;
            rows.push({ name: item.name, thumbSrc: item.thumbSrc, isBlobUrl: !!item.isBlobUrl, furniture: '—', quality: '—', spam: '—', action: 'Review', error: err.message });
        }
        done++;
        progressCount.textContent = `${done} / ${total}`;
        progressFill.style.width = `${(done / total) * 100}%`;
        if (done === total) progressLabel.textContent = 'Done!';
        renderTable();
        return next();
    }

    try {
        const workers = [];
        for (let i = 0; i < Math.min(3, items.length); i++) workers.push(next());
        await Promise.all(workers);
    } finally {
        batchRunning = false;
        urlBtn.disabled = false;
    }
}

// ─── Handle file uploads ───
function handleFiles(fileList) {
    const files = [...fileList].filter(f => f.type.startsWith('image/'));
    const items = files.map(file => ({
        name: file.name,
        thumbSrc: URL.createObjectURL(file),
        isBlobUrl: true,
        getClassification: async (apiKey) => {
            const b64 = await fileToBase64(file);
            return classifyBase64(b64, file.type || 'image/jpeg', apiKey);
        }
    }));
    processBatch(items);
}

// ─── Handle URL input ───
function handleUrls() {
    const text = urlInput.value.trim();
    if (!text) return;
    const urls = text.split('\n').map(l => l.trim()).filter(l => l && (l.startsWith('http://') || l.startsWith('https://')));
    if (!urls.length) { alert('No valid URLs found. Paste one URL per line.'); return; }

    const items = urls.map(url => {
        const name = url.split('/').pop().split('?')[0] || url.slice(0, 60);
        return {
            name,
            thumbSrc: url,
            getClassification: async (apiKey) => classifyUrl(url, apiKey)
        };
    });
    processBatch(items);
}

// ─── Render ───
function renderTable() {
    // Counts
    $('cApprove').textContent = rows.filter(r => r.action === 'Approve').length;
    $('cReview').textContent = rows.filter(r => r.action === 'Review').length;
    $('cReject').textContent = rows.filter(r => r.action === 'Reject').length;

    tbody.innerHTML = rows.map((r, i) => {
        const furnitureBadge = r.furniture === 'Yes' ? 'badge-yes' : r.furniture === 'No' ? 'badge-no' : 'badge-maybe';
        const spamBadge = r.spam === 'Yes' ? 'badge-no' : r.spam === 'No' ? 'badge-yes' : '';
        const actionBadge = r.action === 'Approve' ? 'badge-approve' : r.action === 'Reject' ? 'badge-reject' : 'badge-review';

        const stars = typeof r.quality === 'number'
            ? Array.from({length: 5}, (_, j) => `<span class="${j < r.quality ? 'star-on' : 'star-off'}">\u2605</span>`).join('')
            : '—';

        return `<tr>
            <td><div class="thumb-cell"><img class="thumb" src="${escAttr(r.thumbSrc)}" data-idx="${i}" alt="" onerror="this.style.display='none'"><span class="fname" title="${escAttr(r.name)}">${esc(r.name)}</span></div></td>
            <td><span class="badge ${furnitureBadge}">${esc(r.furniture)}</span></td>
            <td><span class="stars">${stars}</span>${typeof r.quality === 'number' ? ` <span style="color:var(--muted);font-size:0.75rem">(${r.quality}/5)</span>` : ''}</td>
            <td>${r.spam !== '—' ? `<span class="badge ${spamBadge}">${esc(r.spam)}</span>` : '—'}</td>
            <td><span class="badge ${actionBadge}">${esc(r.action)}</span>${r.error ? `<div class="error-cell">${esc(r.error)}</div>` : ''}</td>
        </tr>`;
    }).join('');
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

function escAttr(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ─── CSV Export ───
function exportCSV() {
    if (!rows.length) return;
    const header = ['Filename', 'Furniture Detected', 'Quality (1-5)', 'Spam', 'Recommended Action'];
    const csvRows = rows.map(r => [r.name, r.furniture, r.quality, r.spam, r.action]);
    const csv = '\uFEFF' + [header, ...csvRows].map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    const dlUrl = URL.createObjectURL(blob);
    a.href = dlUrl;
    a.download = `ugc-classification-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(dlUrl);
}

// ─── Events ───

// File drop (counter prevents flicker when dragging over child elements)
let dragCounter = 0;
dropZone.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); });
dropZone.addEventListener('dragleave', () => { dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropZone.classList.remove('dragover'); } });
dropZone.addEventListener('drop', e => { e.preventDefault(); dragCounter = 0; dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
dropZone.addEventListener('click', e => {
    // Prevent double-trigger: only open picker once regardless of which child was clicked
    if (e.target === fileInput) return;
    fileInput.click();
});
fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });

// URLs
urlBtn.addEventListener('click', handleUrls);

// Toolbar
$('clearBtn').addEventListener('click', () => {
    batchAborted = true;
    rows.forEach(r => { if (r.isBlobUrl) URL.revokeObjectURL(r.thumbSrc); });
    rows.length = 0;
    renderTable();
    progress.classList.remove('visible');
    toolbar.classList.remove('visible');
    table.classList.remove('visible');
    empty.style.display = '';
});
$('exportBtn').addEventListener('click', exportCSV);

// Image preview
tbody.addEventListener('click', e => {
    const thumb = e.target.closest('.thumb');
    if (thumb) { modalImg.src = thumb.src; modal.classList.add('visible'); }
});
$('modalX').addEventListener('click', () => modal.classList.remove('visible'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('visible'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('visible'); });
</script>
</body>
</html>
